[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hicscaf"
version = "0.1.0"
description = "AI-assisted Hi-C scaffolding: CNN + GNN correction of YaHS / 3D-DNA scaffolds"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "torch>=2.0",
    "hictkpy>=1.0",   # reads .hic / .cool / .mcool; binary wheels for Windows, macOS, Linux
    "scipy>=1.8",     # fast sparse export from hictkpy
    "pandas>=1.5",    # hictkpy needs pandas + pyarrow to write the corrected .hic
    "pyarrow>=14",
]

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest"]

[project.scripts]
hicscaf = "hicscaf.cli:main"

[tool.setuptools]
packages = ["hicscaf"]

[tool.setuptools.package-data]
hicscaf = ["studio_web/*"]
